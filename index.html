<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>PoultryMate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PoultryMate</h1>
        <p>Manage your flock with ease.</p>
    </header>
   <main>
    <section class="dashboard">

        <div class="card">
            <h2>🐔 Birds</h2>
            <p id="birdCount">5</p>
        </div>
<div class="card eggs-card">
    <h2>🥚 Egg Production</h2>

    <div class="egg-total">
        <p>Today's Eggs</p>
        <strong id="eggCount">0</strong>
    </div>

    <div class="egg-actions">
        <button id="removeEggButton">− Remove</button>
        <button id="addEggButton">+ Add Egg</button>
    </div>

    <div class="egg-rate">
        <p>Today's Laying Rate</p>
        <strong id="layingRate">0%</strong>
    </div>
</div>

        <div class="card">
            <h2>🌾 Feed</h2>

            <p id="feedAmount">0 kg</p>

            <input
                type="number"
                id="feedInput"
                placeholder="Add feed (kg)"
                min="0"
                step="0.01"
            >

            <button id="addFeedButton">+ Add Feed</button>

            <input
                type="number"
                id="useFeedInput"
                placeholder="Use feed (kg)"
                min="0"
                step="0.01"
            >

            <button id="useFeedButton">− Use Feed</button>

            <h3>Feeding Schedule</h3>

            <label for="morningFeedTime">Morning feeding</label>
            <input type="time" id="morningFeedTime">

            <label for="afternoonFeedTime">Afternoon feeding</label>
            <input type="time" id="afternoonFeedTime">

            <button id="saveScheduleButton">Save Schedule</button>

            <p id="scheduleStatus">No schedule saved.</p>

            <hr>

            <h3>Feed Alarm</h3>

            <button id="alarmButton">🔔 Turn Alarm On</button>

            <p id="alarmStatus">Alarm is off.</p>

            <div id="alarmMessage"></div>

            <button id="enableNotifications">
                🔔 Enable Notifications
            </button>
        </div>

        <section class="card">
            <h2>⏰ Next Feed</h2>
            <p id="nextFeed">Not set</p>
        </section>

     <section class="card flock-card">
    <h2>🐔 Flock</h2>

    <div class="flock-total">
        <p>Total Chickens</p>
        <strong id="chickenCount">0</strong>
    </div>

    <div class="flock-actions">
        <button id="removeChicken">− Remove</button>
        <button id="addChicken">+ Add</button>
    </div>

    <hr>

    <h3>Edit Flock Size</h3>

    <input
        type="number"
        id="flockInput"
        placeholder="Enter total chickens"
        min="0"
        step="1"
    >

    <button id="setFlockButton">Update Flock</button>
</section>


    </section>
</main>
   <script src="main.js?v=5"></script>
</body>
</html>
