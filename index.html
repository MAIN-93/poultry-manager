<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>PoultryMate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PoultryMate</h1>
        <p>Manage your flock with ease.</p>
    </header>
   <main>
    <section class="dashboard">

        <div class="card">
            <h2>🐔 Birds</h2>
            <p id="birdCount">5</p>
        </div>

        <div class="card">
            <h2>🥚 Today's Eggs</h2>
            <p id="eggCount">0</p>
    

<button id="addEggButton">+ Add Egg</button>
<button id="removeEggButton">− Remove Egg</button>
        </div>

        <div class="card">
            <h2>🌾 Feed</h2>

            <p id="feedAmount">0 kg</p>

            <input
                type="number"
                id="feedInput"
                placeholder="Add feed (kg)"
                min="0"
                step="0.01"
            >

            <button id="addFeedButton">+ Add Feed</button>

            <input
                type="number"
                id="useFeedInput"
                placeholder="Use feed (kg)"
                min="0"
                step="0.01"
            >

            <button id="useFeedButton">− Use Feed</button>

            <h3>Feeding Schedule</h3>

            <label for="morningFeedTime">Morning feeding</label>
            <input type="time" id="morningFeedTime">

            <label for="afternoonFeedTime">Afternoon feeding</label>
            <input type="time" id="afternoonFeedTime">

            <button id="saveScheduleButton">Save Schedule</button>

            <p id="scheduleStatus">No schedule saved.</p>

            <hr>

            <h3>Feed Alarm</h3>

            <button id="alarmButton">🔔 Turn Alarm On</button>

            <p id="alarmStatus">Alarm is off.</p>

            <div id="alarmMessage"></div>

            <button id="enableNotifications">
                🔔 Enable Notifications
            </button>
        </div>

        <section class="card">
            <h2>⏰ Next Feed</h2>
            <p id="nextFeed">Not set</p>
        </section>

        <section class="card">
    <h2>🐔 Flock</h2>

    <p>Total Chickens: <strong id="chickenCount">0</strong></p>

    <input
        type="number"
        id="flockInput"
        placeholder="Set flock size"
        min="0"
        step="1"
    >

    <button id="setFlockButton">Set Flock</button>

    <button id="addChicken">+ Add Chicken</button>
            <button id="removeChicken">− Remove Chicken</button>
</section>

    </section>
</main>
   <script src="main.js?v=3"></script>
</body>
</html>
